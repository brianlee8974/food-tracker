<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track your food, ingredients, and groceries. Know what you have, how much, and when it expires." />
  <title>Pantry — Food Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ========== HEADER ========== -->
    <header id="app-header">
      <div class="header-content">
        <div class="logo-group">
          <h1>Pantry</h1>
        </div>
        <p class="tagline">Your kitchen, organized.</p>
      </div>
    </header>

    <!-- ========== STATS BAR ========== -->
    <section id="stats-bar">
      <div class="stat-card" id="stat-total">
        <span class="stat-value">0</span>
        <span class="stat-label">Total Items</span>
      </div>
      <div class="stat-card" id="stat-categories">
        <span class="stat-value">0</span>
        <span class="stat-label">Categories</span>
      </div>
      <div class="stat-card" id="stat-expiring">
        <span class="stat-value">0</span>
        <span class="stat-label">Expiring Soon</span>
      </div>
    </section>

    <!-- ========== SEARCH & FILTER BAR ========== -->
    <section id="toolbar">
      <div class="search-wrapper">
        <span class="search-icon">&#x2315;</span>
        <input type="text" id="search-input" placeholder="Search items..." autocomplete="off" />
      </div>
      <div class="filter-group">
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>
        <select id="sort-select">
          <option value="name-asc">Name A→Z</option>
          <option value="name-desc">Name Z→A</option>
          <option value="expiry-asc">Expiry ↑</option>
          <option value="expiry-desc">Expiry ↓</option>
          <option value="date-added">Recently Added</option>
        </select>
      </div>
    </section>

    <!-- ========== ITEM LIST ========== -->
    <main id="item-list">
      <div id="empty-state" class="empty-state">
        <span class="empty-icon">—</span>
        <h2>Your pantry is empty</h2>
        <p>Add your first item to get started.</p>
      </div>
      <!-- Items rendered here by JS -->
    </main>

    <!-- ========== FAB (Add Button) ========== -->
    <button id="fab-add" aria-label="Add new item" title="Add new item">
      <span class="fab-icon">+</span>
    </button>

    <!-- ========== MODAL (Add / Edit) ========== -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">Add Item</h2>
          <button id="modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
        </div>
        <form id="item-form" autocomplete="off">
          <input type="hidden" id="form-id" />

          <div class="form-row">
            <div class="form-group full">
              <label for="form-name">Item Name <span class="required">*</span></label>
              <input type="text" id="form-name" placeholder="e.g. Chicken Breast" required />
            </div>
          </div>

          <div class="form-row two-col">
            <div class="form-group">
              <label for="form-category">Category</label>
              <select id="form-category">
                <option value="Produce">Produce</option>
                <option value="Meat & Seafood">Meat & Seafood</option>
                <option value="Dairy">Dairy</option>
                <option value="Bakery">Bakery</option>
                <option value="Frozen">Frozen</option>
                <option value="Canned Goods">Canned Goods</option>
                <option value="Grains & Pasta">Grains & Pasta</option>
                <option value="Snacks">Snacks</option>
                <option value="Beverages">Beverages</option>
                <option value="Condiments & Sauces">Condiments & Sauces</option>
                <option value="Spices & Herbs">Spices & Herbs</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-storage">Storage</label>
              <select id="form-storage">
                <option value="Fridge">Fridge</option>
                <option value="Freezer">Freezer</option>
                <option value="Pantry">Pantry</option>
                <option value="Counter">Counter</option>
              </select>
            </div>
          </div>

          <div class="form-row three-col">
            <div class="form-group">
              <label for="form-quantity">Quantity</label>
              <input type="number" id="form-quantity" min="0" step="any" value="1" />
            </div>
            <div class="form-group">
              <label for="form-unit">Unit</label>
              <select id="form-unit">
                <option value="pcs">pcs</option>
                <option value="lbs">lbs</option>
                <option value="oz">oz</option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="liters">liters</option>
                <option value="ml">ml</option>
                <option value="cups">cups</option>
                <option value="bags">bags</option>
                <option value="boxes">boxes</option>
                <option value="cans">cans</option>
                <option value="bottles">bottles</option>
                <option value="jars">jars</option>
                <option value="dozen">dozen</option>
                <option value="bunch">bunch</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-expiry">Expiry Date</label>
              <input type="date" id="form-expiry" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group full">
              <label for="form-notes">Notes</label>
              <textarea id="form-notes" rows="2" placeholder="Any additional notes..."></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="btn-cancel" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="btn-save" class="btn btn-primary">Save Item</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ========== DELETE CONFIRM MODAL ========== -->
    <div id="delete-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2>Delete Item</h2>
          <button id="delete-close" class="modal-close-btn" aria-label="Close">&times;</button>
        </div>
        <p class="delete-msg">Are you sure you want to delete <strong id="delete-item-name"></strong>?</p>
        <div class="form-actions">
          <button type="button" id="btn-delete-cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="btn-delete-confirm" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
